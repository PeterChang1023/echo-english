<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回音法英文學習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <a href="./">← 所有課程</a>
    <a id="edit-link" href="#" hidden>編輯</a>
  </nav>
  <h1 id="title"></h1>

  <div class="player">
    <button class="play" id="play" title="播放 / 暫停（空白鍵）">▶</button>
    <span class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="group">
      <button id="prev" title="上一句（←）">⏮</button>
      <button id="next" title="下一句（→）">⏭</button>
      <button id="loop" title="單句重複（R）">🔁 單句</button>
      <button id="speed" title="播放速度">1×</button>
    </div>
  </div>
  <p class="hint">點任何一段文字就只播放那一段。開啟「🔁 單句」後，點一段文字會重複播放那一段。</p>

  <article class="reader" id="reader"></article>
  <audio id="audio" preload="auto"></audio>
</div>
<script>
const SPEEDS = [1, 0.75, 0.5];
const LOOP_PAUSE_MS = 600;   // breathing room before a looped phrase repeats
const END_PAD = 0.12;        // let the last sound of a phrase ring out, unless the next phrase starts sooner
const EARLY_STOP = 0.02;     // stop this much before a back-to-back phrase so its first sound doesn't leak

const $ = id => document.getElementById(id);
const audio = $('audio');
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const id = new URLSearchParams(location.search).get('id');

let segs = [];          // flat list: {start, end, stop, el}
let range = null;       // {start, end} when playing a single phrase
let looping = false;
let speedIdx = 0;
let loopTimer = null;

fetch(`lessons/${encodeURIComponent(id)}/data.json`, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(render)
  .catch(() => { $('title').textContent = '找不到這個課程'; });

fetch('api/voices').then(r => {
  if (r.ok) { $('edit-link').href = `admin.html?id=${encodeURIComponent(id)}`; $('edit-link').hidden = false; }
}).catch(() => {});

function render(data) {
  document.title = data.title;
  $('title').textContent = data.title;
  audio.src = `lessons/${encodeURIComponent(id)}/audio.m4a?v=${data.version}`;
  const reader = $('reader');
  for (const item of data.items) {
    if (item.title !== undefined) {
      const h = document.createElement('h2');
      h.textContent = item.title;
      reader.append(h);
      continue;
    }
    const p = document.createElement('p');
    item.segments.forEach((s, i) => {
      if (i) { const d = document.createElement('span'); d.className = 'dot'; p.append(d); }
      const span = document.createElement('span');
      span.className = 'seg';
      span.textContent = s.text;
      p.append(span);
      addSeg(span, s);
    });
    reader.append(p);
  }
  segs.forEach((s, i) => {
    const next = segs[i + 1];
    s.stop = next && next.start < s.end + END_PAD ? Math.max(s.end - EARLY_STOP, next.start - EARLY_STOP) : s.end + END_PAD;
  });
}

function addSeg(el, s) {
  const seg = { start: s.start, end: s.end, stop: s.end + END_PAD, el };
  segs.push(seg);
  el.addEventListener('click', () => playSeg(seg));
}

function playSeg(seg) {
  clearTimeout(loopTimer);
  range = seg;
  audio.currentTime = seg.start;
  audio.play();
}

function playAll() {
  clearTimeout(loopTimer);
  range = null;
  audio.play();
}

function currentIdx() {
  const t = audio.currentTime;
  let idx = -1;
  for (let i = 0; i < segs.length; i++) if (segs[i].start <= t + 0.01) idx = i;
  return idx;
}

function tick() {
  const t = audio.currentTime;
  if (range && !audio.paused && t >= range.stop) {
    audio.pause();
    if (looping) {
      const seg = range;
      loopTimer = setTimeout(() => playSeg(seg), LOOP_PAUSE_MS / audio.playbackRate);
    }
  }
  const active = range || segs[currentIdx()];
  for (const s of segs) s.el.classList.toggle('active', s === active && (audio.currentTime > 0));
  $('cur').textContent = fmt(t);
  if (audio.duration) $('seek').value = (t / audio.duration) * 1000;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

audio.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(audio.duration); });
audio.addEventListener('play', () => { $('play').textContent = '❚❚'; });
audio.addEventListener('pause', () => { $('play').textContent = '▶'; });

function togglePlay() {
  if (!audio.paused) { audio.pause(); clearTimeout(loopTimer); return; }
  // resuming inside a phrase keeps the phrase boundary; otherwise play straight through
  if (range && audio.currentTime < range.stop) audio.play(); else playAll();
}

function step(dir) {
  if (!segs.length) return;
  const base = range ? segs.indexOf(range) : currentIdx();
  const i = Math.min(segs.length - 1, Math.max(0, base + dir));
  playSeg(segs[i]);
}

$('play').onclick = togglePlay;
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('loop').onclick = () => {
  looping = !looping;
  $('loop').classList.toggle('on', looping);
  if (!looping) clearTimeout(loopTimer);
};
$('speed').onclick = () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIdx];
  $('speed').textContent = `${SPEEDS[speedIdx]}×`;
};
$('seek').oninput = e => {
  if (!audio.duration) return;
  range = null;
  clearTimeout(loopTimer);
  audio.currentTime = (e.target.value / 1000) * audio.duration;
};

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'r' || e.key === 'R') $('loop').click();
});
</script>
</body>
</html>
